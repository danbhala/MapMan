name: Stamp version
description: >-
  Stamps a build's version and build number into its export preset (Android or
  iOS) and writes godot/build_info.json, shown on the DEV overlay and in the
  menus' title block.

inputs:
  preset:
    description: Export preset, e.g. "Android Dev" or "iOS"
    required: true
  version-name:
    description: Full version, e.g. "1.2.0" or "1.2.0-pr.16"
    required: true
  build-number:
    description: version/code (Android) or application/version (iOS); must only ever go up per app
    required: true
  source:
    description: Shown in dev builds, e.g. "pr-12", "master", "v1.2.0"
    required: true
  options:
    description: Extra preset options, one key=value per line (string values in quotes)
    default: ""

runs:
  using: composite
  steps:
    - name: Stamp version and build info
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        NAME: ${{ inputs.version-name }}
        BUILD: ${{ inputs.build-number }}
        SOURCE: ${{ inputs.source }}
        OPTIONS: ${{ inputs.options }}
      run: |
        # No mapfile: macOS runners may run this under bash 3.2.
        extra=()
        while IFS= read -r line; do
          [ -n "${line// /}" ] && extra+=("$line")
        done <<< "$OPTIONS"
        python3 "$GITHUB_ACTION_PATH/stamp.py" "$PRESET" "$NAME" "$BUILD" "$SOURCE" "${extra[@]}"
