name: Build APK
description: Exports and signs a MapMan APK. Needs the setup-godot action with android "true" first.

inputs:
  preset:
    description: Export preset, "Android" (MapMan) or "Android Dev" (MapMan Dev)
    required: true
  version-name:
    description: version/name to stamp into the preset
    required: true
  version-code:
    description: version/code to stamp into the preset (must only ever go up)
    required: true
  source:
    description: Shown in dev builds, e.g. "pr-12", "master", "v1.2.0"
    required: true
  output:
    description: Path of the signed APK to produce
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/stamp-version
      with:
        preset: ${{ inputs.preset }}
        version-name: ${{ inputs.version-name }}
        build-number: ${{ inputs.version-code }}
        source: ${{ inputs.source }}

    - name: Export
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
      run: |
        mkdir -p godot/build
        godot --headless --path godot --import
        godot --headless --path godot --export-release "$PRESET" build/unsigned.apk
        test -s godot/build/unsigned.apk

    - name: Sign
      # uber-apk-signer's built-in debug key is the same key every earlier
      # build used, so phones can install each build over the last one.
      shell: bash
      env:
        OUTPUT: ${{ inputs.output }}
      run: |
        curl -sSfL -o /tmp/uber.jar \
          "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"
        java -jar /tmp/uber.jar -a godot/build/unsigned.apk -o godot/build/signed
        cp godot/build/signed/*.apk "$OUTPUT"
        unzip -l "$OUTPUT" | grep -q assets/data/levels.json
