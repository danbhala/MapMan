name: Release

# Versioning is driven by Conventional Commits (feat:, fix:, feat!: ...).
# On every push to master, release-please keeps a "chore(main): release X.Y.Z"
# pull request up to date with the next version and its CHANGELOG entry.
# Merging that PR tags vX.Y.Z and creates the GitHub Release; the android job
# below then builds the APK, attaches it to the release and refreshes the
# android-build branch that phones download from.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  android:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: ./.github/actions/setup-godot
        with:
          android: "true"

      - name: Work out the version code
        id: code
        # version/code must only ever go up: 1.2.3 -> 10203.
        run: |
          echo "code=$(( ${{ needs.release-please.outputs.major }} * 10000 + ${{ needs.release-please.outputs.minor }} * 100 + ${{ needs.release-please.outputs.patch }} ))" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-apk
        with:
          preset: Android
          version-name: ${{ needs.release-please.outputs.version }}
          version-code: ${{ steps.code.outputs.code }}
          source: ${{ needs.release-please.outputs.tag_name }}
          output: MapMan.apk

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" MapMan.apk --clobber
          {
            echo
            echo "**Install on Android:** download MapMan.apk below on your phone and open it."
          } > install-note.md
          gh release view "$TAG" --json body --jq .body > notes.md
          cat install-note.md >> notes.md
          gh release edit "$TAG" --notes-file notes.md

      - name: Refresh the android-build branch (the phone download link)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin android-build
          git worktree add /tmp/android-build origin/android-build
          cp MapMan.apk /tmp/android-build/MapMan.apk
          cd /tmp/android-build
          sed -i "s/^Version .*, built from master/Version $VERSION, built from master/" README.md
          git add MapMan.apk README.md
          git commit -m "chore: android build $VERSION"
          git push origin HEAD:android-build
