name: Release

# When master gets a version (version/name in godot/export_presets.cfg) that
# has no tag yet, build the Android APK, tag the commit vX.Y and publish a
# GitHub Release with that version's CHANGELOG section as its notes.
# Merging a version bump is all a release needs.

on:
  push:
    branches: [master]
    paths:
      - CHANGELOG.md
      - godot/export_presets.cfg
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.1
  UBER_SIGNER_VERSION: 1.3.0

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version and whether it is new
        id: version
        run: |
          version=$(sed -n 's/^version\/name="\(.*\)"/\1/p' godot/export_presets.cfg)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || {
            echo "::error::Version $version has no '## [$version]' section in CHANGELOG.md"; exit 1; }
          echo "new=true" >> "$GITHUB_OUTPUT"

      - name: Tag 1.0, the first Godot release (one-off; skipped once it exists)
        run: |
          if ! git rev-parse -q --verify refs/tags/v1.0 >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v1.0 ded2d6e -m "MapMan 1.0: Godot 4.5 port of the Pythonista original"
            git push origin v1.0
          fi

      - name: Cache Godot and export templates
        if: steps.version.outputs.new == 'true'
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-android-${{ env.GODOT_VERSION }}

      - name: Download Godot and its Android templates
        if: steps.version.outputs.new == 'true' && steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSfL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$templates"
          curl -sSfL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz templates/android_release.apk templates/version.txt -d "$templates"
          rm /tmp/templates.tpz

      - name: Point Godot at the runner's Android SDK and Java
        if: steps.version.outputs.new == 'true'
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          EOF

      - name: Build the APK
        if: steps.version.outputs.new == 'true'
        run: |
          mkdir -p godot/build
          ~/godot/godot --headless --path godot --import
          ~/godot/godot --headless --path godot --export-release "Android" build/MapMan-unsigned.apk
          test -s godot/build/MapMan-unsigned.apk

      - name: Sign the APK
        if: steps.version.outputs.new == 'true'
        # uber-apk-signer's built-in debug key is the same key every earlier
        # build used, so phones can install each release over the last one.
        run: |
          curl -sSfL -o /tmp/uber.jar \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v${UBER_SIGNER_VERSION}/uber-apk-signer-${UBER_SIGNER_VERSION}.jar"
          java -jar /tmp/uber.jar -a godot/build/MapMan-unsigned.apk -o godot/build/signed
          cp godot/build/signed/*.apk MapMan.apk
          unzip -l MapMan.apk | grep -q assets/data/levels.json

      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[.*\]: / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "**Install on Android:** download MapMan.apk below on your phone and open it."
          } >> notes.md
          gh release create "v$version" MapMan.apk --target "$GITHUB_SHA" \
            --title "MapMan $version" --notes-file notes.md
