name: Release

# Versioning is driven by Conventional Commits (feat:, fix:, feat!: ...).
# On every push to master, release-please keeps a "chore(main): release X.Y.Z"
# pull request up to date with the next version and its CHANGELOG entry.
# Merging that PR tags vX.Y.Z and creates the GitHub Release; the android job
# below then builds the APK, attaches it to the release and refreshes the
# android-build branch that phones download from.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GODOT_VERSION: 4.5.1
  UBER_SIGNER_VERSION: 1.3.0

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  android:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Stamp the version into the Android preset
        # version/code must only ever go up: 1.2.3 -> 10203.
        run: |
          code=$(( ${{ needs.release-please.outputs.major }} * 10000 + ${{ needs.release-please.outputs.minor }} * 100 + ${{ needs.release-please.outputs.patch }} ))
          sed -i "s/^version\/name=.*/version\/name=\"$VERSION\"/; s/^version\/code=.*/version\/code=$code/" godot/export_presets.cfg
          grep '^version/' godot/export_presets.cfg

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-android-${{ env.GODOT_VERSION }}

      - name: Download Godot and its Android templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSfL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$templates"
          curl -sSfL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz templates/android_release.apk templates/version.txt -d "$templates"
          rm /tmp/templates.tpz

      - name: Point Godot at the runner's Android SDK and Java
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          EOF

      - name: Build the APK
        run: |
          mkdir -p godot/build
          ~/godot/godot --headless --path godot --import
          ~/godot/godot --headless --path godot --export-release "Android" build/MapMan-unsigned.apk
          test -s godot/build/MapMan-unsigned.apk

      - name: Sign the APK
        # uber-apk-signer's built-in debug key is the same key every earlier
        # build used, so phones can install each release over the last one.
        run: |
          curl -sSfL -o /tmp/uber.jar \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v${UBER_SIGNER_VERSION}/uber-apk-signer-${UBER_SIGNER_VERSION}.jar"
          java -jar /tmp/uber.jar -a godot/build/MapMan-unsigned.apk -o godot/build/signed
          cp godot/build/signed/*.apk MapMan.apk
          unzip -l MapMan.apk | grep -q assets/data/levels.json

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" MapMan.apk --clobber
          {
            echo
            echo "**Install on Android:** download MapMan.apk below on your phone and open it."
          } > install-note.md
          gh release view "$TAG" --json body --jq .body > notes.md
          cat install-note.md >> notes.md
          gh release edit "$TAG" --notes-file notes.md

      - name: Refresh the android-build branch (the phone download link)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin android-build
          git worktree add /tmp/android-build origin/android-build
          cp MapMan.apk /tmp/android-build/MapMan.apk
          cd /tmp/android-build
          sed -i "s/^Version .*, built from master/Version $VERSION, built from master/" README.md
          git add MapMan.apk README.md
          git commit -m "chore: android build $VERSION"
          git push origin HEAD:android-build
