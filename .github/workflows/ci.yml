name: MapMan checks

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit and a virtual display
        run: |
          pip install "gdtoolkit==4.5.0"
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - uses: ./.github/actions/setup-godot

      - name: Verify (lint, import, unit tests, all levels, screenshots)
        env:
          VERIFY_OUT: ${{ runner.temp }}/verify
        run: godot/tools/verify.sh --full

      - name: Level difficulty report
        if: always()
        run: python3 godot/tools/level_report.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: ${{ runner.temp }}/verify
