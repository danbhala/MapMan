name: Claude

# Mention @claude in an issue, issue comment, PR comment or review and Claude
# Code works on it in GitHub Actions: it reads CLAUDE.md and uses the repo's
# skills (/verify, /commit, /open-pr ...), so its PRs follow the same rules.
#
# Needs one secret: ANTHROPIC_API_KEY, or CLAUDE_CODE_OAUTH_TOKEN for a
# Claude subscription (run `claude setup-token` to create one). Only people
# with write access to the repo can trigger it.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tools Claude needs to check its own work with godot/tools/verify.sh.
      - uses: ./.github/actions/setup-godot
      - name: Install gdtoolkit and a virtual display
        run: |
          pip install "gdtoolkit==4.5.0"
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(godot/tools/verify.sh:*),Bash(godot:*),Bash(python3 godot/tools/*),Bash(git:*),Bash(gh:*)"
