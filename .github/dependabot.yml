version: 2
updates:
  # Keeps the actions used by the workflows (and shared actions) up to date.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: ["type: ci", "area: tooling"]
